services:
  blabin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controller
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Etc/UTC}
    command: ["/app/scripts/blabin-entrypoint.sh"]
    restart: unless-stopped
    # platform: linux/arm64/v8

    # just for testing on MAC
    volumes:
      - /Users/RileyBallachay/.config/pulse:/home/vscode/.config/pulse:ro
